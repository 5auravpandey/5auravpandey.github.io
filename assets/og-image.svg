<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Monogram Logo Box -->
  <g transform="translate(80, 80)">
    <rect width="72" height="72" rx="16" fill="rgba(37, 99, 235, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2" />
    <path d="M48 24C48 18 43 14 36 14C29 14 24 18 24 24C24 31 31 33 36.5 35C42.5 37.2 48 39.5 48 47C48 53.5 43 57.5 36 57.5C28 57.5 23 53 23 46" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <circle cx="53" cy="18" r="5" fill="#22c55e" />
  </g>

  <!-- Name & Title -->
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">
    Saurav Pandey
  </text>
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#60a5fa">
    Full-Stack, Systems &amp; Web3 Developer
  </text>

  <!-- Bio / Roles Description -->
  <text x="80" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#9ca3af">
    Programming Assistant in Avionics at HAL • MCA Student at IIIT Ranchi &amp; IIT Patna
  </text>
  <text x="80" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6b7280">
    Building software from first principles — C++, Java Servlets, Node.js, and Internet Computer DApps.
  </text>

  <!-- Capability Badges -->
  <g transform="translate(80, 440)">
    <!-- Badge 1: Systems -->
    <rect x="0" y="0" width="200" height="44" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="100" y="28" font-family="'IBM Plex Mono', Consolas, monospace" font-size="16" fill="#e5e7eb" text-anchor="middle">⚡ Systems &amp; C++</text>

    <!-- Badge 2: Java & SQL -->
    <rect x="216" y="0" width="230" height="44" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="331" y="28" font-family="'IBM Plex Mono', Consolas, monospace" font-size="16" fill="#e5e7eb" text-anchor="middle">☕ Core Java &amp; SQL</text>

    <!-- Badge 3: Web3 -->
    <rect x="462" y="0" width="200" height="44" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="562" y="28" font-family="'IBM Plex Mono', Consolas, monospace" font-size="16" fill="#e5e7eb" text-anchor="middle">⛓️ Web3 &amp; DApps</text>

    <!-- Badge 4: Full-Stack -->
    <rect x="678" y="0" width="240" height="44" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="798" y="28" font-family="'IBM Plex Mono', Consolas, monospace" font-size="16" fill="#e5e7eb" text-anchor="middle">🌐 Full-Stack Node.js</text>
  </g>

  <!-- Footer Row -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="80" y="560" font-family="'IBM Plex Mono', Consolas, monospace" font-size="18" fill="#3b82f6">
    https://sauravpandey.me
  </text>
  <text x="1120" y="560" font-family="'IBM Plex Mono', Consolas, monospace" font-size="16" fill="#6b7280" text-anchor="end">
    Gopalganj, Bihar &bull; Korwa, Amethi, UP
  </text>
</svg>
