<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .bg { fill: #0f141c; }
      .border { stroke: rgba(255, 255, 255, 0.1); }
      .stroke-s { stroke: url(#sGrad); }
      .pulse-dot { fill: #22c55e; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .border { stroke: rgba(0, 0, 0, 0.12); }
      }
    </style>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="bg" width="32" height="32" rx="8" />
  <rect class="border" width="30" height="30" x="1" y="1" rx="7" fill="none" stroke-width="1" />

  <!-- Survey Corps Wings of Freedom Emblem -->
  <defs>
    <linearGradient id="favShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a38" />
      <stop offset="100%" stop-color="#0a1219" />
    </linearGradient>
    <linearGradient id="favBlueWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="favWhiteWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Outer Shield -->
  <path d="M16 2 L28 5 L28 18 C28 25 16 30 16 30 C16 30 4 25 4 18 L4 5 Z" 
        fill="url(#favShieldGrad)" 
        stroke="#c5a059" 
        stroke-width="1.2" />

  <!-- Left Wing (White Feathers) -->
  <path d="M16 6 C13 7.5 8 9.5 6 14 C8 12.5 11 12 13 13 C11 14.5 9 17 7 19 C9 17.5 12 16.5 14 18 C11 20 9 23 8 26 C10 24 13 22 16 24 Z" 
        fill="url(#favWhiteWing)" 
        stroke="#334155" 
        stroke-width="0.4" />

  <!-- Right Wing (Blue Feathers) -->
  <path d="M16 10 C19 11.5 24 13.5 26 18 C24 16.5 21 16 19 17 C21 18.5 23 21 25 23 C23 21.5 20 20.5 18 22 C21 24 23 27 24 30 C22 28 19 26 16 28 Z" 
        fill="url(#favBlueWing)" 
        stroke="#1e293b" 
        stroke-width="0.4" />

  <line x1="16" y1="5" x2="16" y2="28" stroke="#c5a059" stroke-width="0.8" stroke-dasharray="1.5 1" />
  <circle cx="16" cy="5.5" r="1.1" fill="#eab308" />
  <circle cx="25" cy="5.5" r="1.8" fill="#10b981" />
</svg>
